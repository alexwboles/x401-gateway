[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "x401-gateway"
version = "0.1.0"
description = "Free, self-hosted x401 (v0.2.0) agent identity gateway: Python verifier library + self-hosted identity wallet"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[tool.setuptools.packages.find]
include = ["x401*", "wallet*", "demo*"]
